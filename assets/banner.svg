<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Иван Шехавцов, продуктовый и системный аналитик, AI-продукты">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1F36"/>
      <stop offset="1" stop-color="#17407A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5B8DEF" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="type"><rect x="60" y="150" width="0" height="50"><animate attributeName="width" from="0" to="620" dur="2.4s" begin=".4s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <g font-family="Montserrat, 'Segoe UI', Arial, sans-serif">
    <text x="60" y="118" fill="#F4F7FB" font-size="60" font-weight="800">Иван Шехавцов</text>
    <g clip-path="url(#type)"><text x="60" y="186" fill="#FFB938" font-size="28" font-weight="700">Продуктовый и системный аналитик</text></g>
    <text x="60" y="236" fill="#B9C9E3" font-size="18" font-weight="500">Студент «Сириуса». AI-продукты и автоматизация.</text>
    <rect x="60" y="260" width="12" height="12" rx="3" fill="#FFB938"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
    <!-- экран 1: виртуальный пациент -->
    <g transform="translate(700 40)">
      <rect width="230" height="210" rx="14" fill="#F4F7FB" fill-opacity=".97"/>
      <rect width="230" height="30" rx="14" fill="#DCE6F5"/><rect y="16" width="230" height="14" fill="#DCE6F5"/>
      <circle cx="16" cy="15" r="4" fill="#9DB0CE"/><circle cx="30" cy="15" r="4" fill="#9DB0CE"/><circle cx="44" cy="15" r="4" fill="#9DB0CE"/>
      <text x="62" y="19" font-size="11" font-weight="700" fill="#52627A">Виртуальный пациент</text>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.11;0.93;1" dur="9s" repeatCount="indefinite"/><rect x="14" y="46" width="150" height="26" rx="10" fill="#DCE6F5"/><text x="24" y="63" font-size="11" font-weight="600" fill="#0C1F36">Что вас беспокоит?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.28;0.93;1" dur="9s" repeatCount="indefinite"/><rect x="60" y="80" width="156" height="40" rx="10" fill="#2F6FE4"/><text x="70" y="96" font-size="11" font-weight="600" fill="#FFFFFF">Болит в правом боку,</text><text x="70" y="108" font-size="11" font-weight="600" fill="#FFFFFF">мне очень тревожно...</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.51;0.93;1" dur="9s" repeatCount="indefinite"/><rect x="14" y="128" width="132" height="26" rx="10" fill="#DCE6F5"/><text x="24" y="145" font-size="11" font-weight="600" fill="#0C1F36">С какого времени?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.68;0.93;1" dur="9s" repeatCount="indefinite"/><rect x="70" y="162" width="146" height="26" rx="10" fill="#2F6FE4"/><text x="80" y="179" font-size="11" font-weight="600" fill="#FFFFFF">Три дня, не сплю</text></g>
    </g>
    <!-- экран 2: оператор 112 -->
    <g transform="translate(950 40)">
      <rect width="200" height="210" rx="14" fill="#F4F7FB" fill-opacity=".97"/>
      <rect width="200" height="30" rx="14" fill="#DCE6F5"/><rect y="16" width="200" height="14" fill="#DCE6F5"/>
      <circle cx="16" cy="15" r="4" fill="#9DB0CE"/><circle cx="30" cy="15" r="4" fill="#9DB0CE"/><circle cx="44" cy="15" r="4" fill="#9DB0CE"/>
      <text x="62" y="19" font-size="11" font-weight="700" fill="#52627A">Оператор 112</text>
      <circle cx="20" cy="50" r="5" fill="#E5484D"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <text x="32" y="54" font-size="11" font-weight="700" fill="#0C1F36">Входящий вызов</text>
      <text x="14" y="76" font-size="12" font-weight="800" fill="#0C1F36">Дым в подъезде</text>
      <text x="14" y="92" font-size="10" font-weight="500" fill="#52627A">ул. Ленина, 12, подъезд 2</text>
      <circle cx="22" cy="118" r="7" fill="#DCE6F5"/><circle cx="22" cy="118" r="7" fill="#2EB67D" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.26;0.93;1" dur="9s" repeatCount="indefinite"/></circle><path d="M18.5 118 l2.6 2.8 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.26;0.93;1" dur="9s" repeatCount="indefinite"/></path><text x="36" y="122" font-size="11" font-weight="600" fill="#0C1F36">Уточнить адрес</text><circle cx="22" cy="140" r="7" fill="#DCE6F5"/><circle cx="22" cy="140" r="7" fill="#2EB67D" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.37;0.43;0.93;1" dur="9s" repeatCount="indefinite"/></circle><path d="M18.5 140 l2.6 2.8 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.37;0.43;0.93;1" dur="9s" repeatCount="indefinite"/></path><text x="36" y="144" font-size="11" font-weight="600" fill="#0C1F36">Оценить угрозу</text><circle cx="22" cy="162" r="7" fill="#DCE6F5"/><circle cx="22" cy="162" r="7" fill="#2EB67D" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.6;0.93;1" dur="9s" repeatCount="indefinite"/></circle><path d="M18.5 162 l2.6 2.8 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.6;0.93;1" dur="9s" repeatCount="indefinite"/></path><text x="36" y="166" font-size="11" font-weight="600" fill="#0C1F36">Вызвать службы</text><circle cx="22" cy="184" r="7" fill="#DCE6F5"/><circle cx="22" cy="184" r="7" fill="#2EB67D" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.71;0.77;0.93;1" dur="9s" repeatCount="indefinite"/></circle><path d="M18.5 184 l2.6 2.8 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.71;0.77;0.93;1" dur="9s" repeatCount="indefinite"/></path><text x="36" y="188" font-size="11" font-weight="600" fill="#0C1F36">Передать вызов</text>
    </g>
  </g>
</svg>
