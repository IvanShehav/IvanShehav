<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Иван Шехавцов, AI-продукты и автоматизация">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1F36"/>
      <stop offset="1" stop-color="#17407A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5B8DEF" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="type"><rect x="60" y="150" width="0" height="50"><animate attributeName="width" from="0" to="640" dur="2.4s" begin=".4s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <g font-family="Montserrat, 'Segoe UI', Arial, sans-serif">
    <text x="60" y="118" fill="#F4F7FB" font-size="60" font-weight="800">Иван Шехавцов</text>
    <g clip-path="url(#type)"><text x="60" y="186" fill="#FFB938" font-size="28" font-weight="700">Строю AI-продукты и автоматизацию</text></g>
    <text x="60" y="236" fill="#B9C9E3" font-size="18" font-weight="500">Студент ИТ-специалитета «Сириуса». От идеи и интервью до прототипа и запуска.</text>
    <rect x="60" y="260" width="12" height="12" rx="3" fill="#FFB938"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
  <!-- мини-окно с чатом -->
  <g transform="translate(790 46)">
    <rect width="340" height="150" rx="14" fill="#F4F7FB" fill-opacity=".96"/>
    <rect width="340" height="30" rx="14" fill="#DCE6F5"/>
    <rect y="16" width="340" height="14" fill="#DCE6F5"/>
    <circle cx="18" cy="15" r="4.5" fill="#9DB0CE"/><circle cx="34" cy="15" r="4.5" fill="#9DB0CE"/><circle cx="50" cy="15" r="4.5" fill="#9DB0CE"/>
    <rect x="16" y="44" width="190" height="26" rx="10" fill="#DCE6F5"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="104" y="80" width="220" height="26" rx="10" fill="#2F6FE4"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.35;.9;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="16" y="116" width="150" height="22" rx="10" fill="#DCE6F5"><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.4;.5;.6;.9;1" dur="8s" repeatCount="indefinite"/></rect>
  </g>
  <!-- мини-окно с радаром -->
  <g transform="translate(900 150)">
    <rect width="230" height="140" rx="14" fill="#0C1F36" stroke="#5B8DEF" stroke-opacity=".5"/>
    <g transform="translate(115 74)" fill="none" stroke="#5B8DEF" stroke-opacity=".45">
      <polygon points="0,-48 45.6,-14.8 28.2,38.8 -28.2,38.8 -45.6,-14.8"/>
      <polygon points="0,-28 26.6,-8.6 16.5,22.6 -16.5,22.6 -26.6,-8.6"/>
      <polygon fill="#2F6FE4" fill-opacity=".45" stroke="#FFB938" stroke-width="2" points="0,-38 34,-10 14,30 -22,26 -30,-12">
        <animate attributeName="points" dur="5s" repeatCount="indefinite" values="0,-38 34,-10 14,30 -22,26 -30,-12;0,-24 40,-14 24,34 -14,20 -38,-6;0,-44 24,-6 10,22 -30,34 -34,-16;0,-38 34,-10 14,30 -22,26 -30,-12"/>
      </polygon>
    </g>
  </g>
</svg>
